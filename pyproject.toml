[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danfoss-ecl"
version = "0.1.0"
description = "Modbus register map and dump CLI for Danfoss ECL Comfort 310 (application A266.1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Danfoss ECL contributors" }]
keywords = ["danfoss", "ecl", "modbus", "district-heating", "a266"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "pymodbus>=3.6",
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ecl-dump = "danfoss_ecl.dump:main"

[project.urls]
Homepage = "https://github.com/muddermanden/danfoss-ecl"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
danfoss_ecl = ["locale/*/LC_MESSAGES/*.po"]
