[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danfoss-ecl"
version = "0.1.0"
description = "Read-only register catalog and dump CLI for the Danfoss ECL Comfort 310 (application A266.x) over Modbus"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "muddermanden" }]
keywords = ["danfoss", "ecl", "modbus", "district-heating", "a266"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "pymodbus>=3.6",
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ecl-dump = "danfoss_ecl.dump:main"

[project.urls]
Homepage = "https://github.com/muddermanden/danfoss-ecl"
Issues = "https://github.com/muddermanden/danfoss-ecl/issues"
"Home Assistant package" = "https://github.com/muddermanden/homeassistant-danfoss-ecl310"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
danfoss_ecl = ["locale/*/LC_MESSAGES/*.po"]
